<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <script>
    try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('jambook:theme')) || 'dark'; }
    catch { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <title>Jambook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <script>window.Jambook = { instruments: {} };</script>
  <script src="js/music.js"></script>
  <script src="js/song-format.js"></script>
  <script src="js/fretboard.js"></script>
  <script src="js/instruments/guitar.js"></script>
  <script src="js/instruments/mandolin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
